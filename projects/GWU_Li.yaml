Department: Biomedical Engineering
Description: 'Our current research explores the application of deep learning for point-of-care
  biosensor data analysis. For example, we deploy personal physiological and environmental
  sensors to collect multi-dimensional biological and exposure data, and use deep
  neural network models to predict the probabilities of potential asthma exacerbations.

  Below is our group website:

  https://sites.google.com/site/gwulilab'
